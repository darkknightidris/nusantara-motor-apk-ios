name: Build Nusantara Motor iOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web
        run: npm run build

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Install CocoaPods if needed
        run: |
          if [ -f ios/App/Podfile ]; then
            cd ios/App
            pod install
          fi

      - name: Build iOS
        run: |
          cd ios/App
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/NusantaraMotor.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            archive

      - name: Export unsigned app
        run: |
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$RUNNER_TEMP/NusantaraMotor.xcarchive/Products/Applications/App.app" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -r NusantaraMotor-iOS-unsigned.zip Payload

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: NusantaraMotor-iOS-unsigned
          path: ${{ runner.temp }}/NusantaraMotor-iOS-unsigned.zip
